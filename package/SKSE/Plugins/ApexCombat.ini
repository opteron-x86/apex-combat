; Apex Combat configuration. Restart the game after changing this file.
; Boolean values: true/false or 1/0. Unknown keys and invalid values are logged.
; Duplicate keys keep their first value. Invalid numeric values retain defaults.
; Invalid booleans become false. Costs and restoration must be finite and nonnegative.

[General]
enabled = true
playerAttacks = true
npcAttacks = true
patchAttackIdles = true

[Stamina]
; Light attack costs: 0..10000 stamina.
lightOneHandedCost = 20
lightTwoHandedCost = 33
unarmedCost = 10
; Per-weapon-type light attack costs: 0..10000 stamina.
; Swords and unmapped weapon types use lightOneHandedCost.
daggerCost = 10
axeCost = 25
maceCost = 25
; Multiplier for dual-wield attacks: 1..10. The averaged per-hand cost of
; both equipped weapons is scaled by this value.
dualWieldMultiplier = 1.6
; positive: any stamina above zero admits an attack; the debit cannot go below zero.
; full: admission requires the entire calculated cost.
; Power attacks retain the game's own stamina debit.
affordability = positive
; Delay in seconds after a stamina debit: 0..10.
regenDelaySeconds = 0.5
; Delay in seconds before stamina regen after a dodge starts: 0..10.
dodgeRegenDelaySeconds = 0.5
; Delay in seconds before stamina regen after exhaustion: 0..10.
exhaustionRecoveryDelaySeconds = 1.0
; Stamina drained per second while a bow is drawn: 0..10000; 0 disables it.
bowDrawDrainPerSecond = 5.0
; Maximum time between admission and commitment: 1..10000 milliseconds.
attackCommitTimeoutMs = 1000
; Player-only multiplier on the vanilla stamina regen rate: 0.1..10, where
; 1 is vanilla and 1.5 is 50% faster. NPCs keep vanilla regen so exhaustion
; punish windows stay meaningful.
regenMult = 1.5
; Optional stamina charge on dodge animation events: 0..10000.
; Keep 0 when the dodge framework owns admission checks and stamina costs.
; A positive value adds an Apex charge and does not replace framework costs.
dodgeStaminaCost = 0

[PerfectBlock]
enabled = true
npcEnabled = true
; A fresh block start opens this window: 1..1000 milliseconds.
windowMs = 150
; Restore up to this amount on a confirmed perfect block: 0..10000 stamina.
restore = 25
; Minimum interval between fresh block starts: 0..10000 milliseconds; 0 disables it.
rearmDelayMs = 200
; Total frontal blocking cone: 1..360 degrees.
blockAngleDegrees = 120
; Perfect-parry feedback sounds as Plugin.esp|0xFormID of a sound record.
; Empty disables feedback; an unresolvable spec degrades to silence.
; Defaults point at the shipped ApexCombat.esp clangs; without that plugin
; the parry is silent (VFX still fire). For Honor Reforged users can
; repoint at its clangs instead:
;   parrySoundWeapon = For Honor Balance Patch.esp|0x82D
;   parrySoundShield = For Honor Balance Patch.esp|0x82C
parrySoundWeapon = ApexCombat.esp|0x800
parrySoundShield = ApexCombat.esp|0x801
; Scales the parry clang volume: 0..2, where 1 is the descriptor level.
parrySoundVolume = 1.0
; Parry spark VFX at the blocking weapon or shield: attaches the vanilla
; metal-spark impact root so the engine fires its own spark. Independent of the
; clang.
parryVisual = true

[CounterAttack]
; Grants the defender of a perfect parry one free power attack: 0 stamina.
; The reward fires once, expires with the window, and refreshes if another
; perfect parry lands while it is armed. Only power attacks spend it.
enabled = true
; Length of the counterattack window: 1..10000 milliseconds.
windowMs = 1500
; Attacks during the window also deal bonus poise damage; see the
; [Poise] counterattackPoiseMultiplier setting.

[Poise]
; Poise pool owning stagger. Keep this disabled while an older poise mod is
; still installed, or both systems will stagger.
enabled = true
; Poise pool size per actor: 1..100000.
maxPoise = 100
; Poise damage per light hit by weapon class: 0..10000.
daggerDamage = 20
swordDamage = 25
axeDamage = 30
maceDamage = 35
twoHandedDamage = 40
unarmedDamage = 15
; Multiplier applied to power attacks: 0..100.
powerMultiplier = 1.5
; Bonus multiplier applied to poise damage dealt by an attacker inside an
; active counterattack window (armed by a perfect parry): 1..100, where 1
; disables the bonus. The flat perfect-parry counter-damage ignores it.
counterattackPoiseMultiplier = 1.25
; Fraction of poise damage that passes through an ordinary held block: 0..10.
blockedMultiplier = 0.5
; Flat poise damage dealt to an attacker whose strike is perfect-parried: 0..10000.
perfectParryDamage = 50
; Publish poise through TrueHUD's special resource bar (requires TrueHUD).
hud = true
; Delay in seconds before poise regen after a hit: 0..60.
recoveryDelaySeconds = 3.0
; Poise regenerated per second after the delay: 0..100000.
recoveryPerSecond = 20.0
; Stagger length after a break, in seconds: 0..60.
breakRecoverySeconds = 1.5

; ---- Combat AI Director (attack slots, bash discipline, circling) ----
; Disable other attack-slot and bash-cooldown systems when enabling this section.
[Director]
enabled = false
; Limit slot pacing to NPCs targeting the player (NPC-vs-NPC stays vanilla).
playerOnly = true
; Maximum simultaneous melee attackers per target: 1..5.
maxAttackers = 2
; A granted attack slot lasts a randomized interval in this range (seconds).
slotWindowMinSeconds = 4.0
slotWindowMaxSeconds = 8.0
; When the player hits a circling NPC, that NPC may retaliate past the slot
; count for this long (seconds). 0 disables retaliation.
retaliationSeconds = 3.0
; Minimum interval between one NPC's bashes (seconds).
bashCooldownSeconds = 6.0
; Chance a blocking shield NPC bashes in reaction to a player attack: 0..1.
bashReactionChance = 0.35
; Chance of a bash against a passive target: 0..1. 0 means no unpunishable
; openers while the player just stands there.
bashProactiveChance = 0.0
; Deprecated compatibility key; ignored. Skyrim owns normal/power bash costs.
bashStaminaCost = 0
; A circling NPC that has seen no opening for this long commits anyway
; (seconds), so circlers cannot stall a fight forever.
maxCircleSeconds = 10.0
; Circling ring radius band for non-slot holders (game units): 50..2000.
circleRadiusMin = 200
circleRadiusMax = 320

; ---- Stamina potion rework (timed cost discount) ----
; Converted potions replace their instant stamina refill with a timed discount.
; Requires the generated ApexCombat - Potions.esp patch for your load order.
; Discount applies to Apex-owned costs and sprint, not external dodge costs,
; regular engine-owned power attacks, or blocked impacts. A new dose replaces
; the current discount and starts its full duration, even with a weaker tier.
; Discounts do not stack. Unpatched potions are unchanged.
[Potions]
enabled = true
; Discount percent per tier: 0..100. The ultimate tier (vanilla magnitude
; 9999) reduces the affected costs to zero.
discountMinor = 10
discountStandard = 20
discountPlentiful = 30
discountVigorous = 50
discountExtreme = 75
discountUltimate = 100
; Discount duration in seconds: 1..3600. The ultimate tier gets its own,
; shorter window.
standardSeconds = 60
ultimateSeconds = 20

[Debug]
trace = false
